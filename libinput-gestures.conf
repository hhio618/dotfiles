# libinput-gestures configuration
# Docs: `man libinput-gestures.conf`
#
# Swipe to change the active workspace (session windows 1, 2, 3, ...).
# NOTE: directions below are already reversed on purpose because this
# touchpad reports natural/inverted gesture directions.

# Three-finger horizontal swipes -> previous / next workspace
gesture swipe left 3 swaymsg workspace prev
gesture swipe right 3 swaymsg workspace next

# Three-finger vertical swipes -> previous / next workspace as well
gesture swipe up 3 swaymsg workspace prev
gesture swipe down 3 swaymsg workspace next

# Four-finger horizontal swipes -> previous / next workspace
gesture swipe left 4 swaymsg workspace prev
gesture swipe right 4 swaymsg workspace next

# Optional: three-finger pinch to open the launcher
# gesture pinch in 3 rofi -show drun -theme ~/.config/rofi/theme.rasi
